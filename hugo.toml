baseURL = 'https://intothedata.com/'
languageCode = 'ko-KR'
title = '인투더데이터 - AI 데이터과학 위키'
theme = 'book'
defaultContentLanguage = "ko"
multilingual = true

# Google Analytics 설정
[services]
  [services.googleAnalytics]
    id = "G-L822Z5JJRH"

# lastmod를 활성화
enableGitInfo = true

[frontmatter]
date = ["date", "publishDate", "lastmod"]
lastmod = ["lastmod", ":git", "date", "publishDate"]
publishDate = ["publishDate", "date"]
expiryDate = ["expiryDate"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.tableOfContents]
    startLevel = 1

[outputs]
    home = [ "HTML"]
    page = [ "HTML"]
    tags = [ "HTML"]

[taxonomies]
  category = "categories"
  tag = "tags"


[params]
  math = true
  subtitle = "데이터과학 학습"
  author = "IntoTheData"
  
  # Book theme specific settings
  BookTheme = "light"
  BookToC = true
  BookSection = "/"  # Using root for all sections
  BookSearch = true
  BookComments = false
  
  custom_css = ["css/intothedata.css"]

[[menu.shortcuts]]
pre = "<h3>More</h3>"
name = "<i class='fa fa-bookmark'></i> 색인"
identifier = "tag-list"
url = "/taglist"
weight = 1

[[menu.shortcuts]]
name = "<i class='fa fa-envelope'></i> Contact"
identifier = "contact"
url = "mailto: intothedata@gmail.com"
weight = 2
