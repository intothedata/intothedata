baseURL = 'https://intothedata.com/'
languageCode = 'ko-KR'
title = '인투더데이터 데이터과학'
theme = 'book'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]

[outputs]
    home = [ "HTML"]
    page = [ "HTML"]
    tags = [ "HTML"]

[taxonomies]
  category = "categories"
  tag = "tags"


[params]
  math = true


