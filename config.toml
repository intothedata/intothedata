# ------------------------------
# intothedata hugo configuration
# ------------------------------

baseURL = "http://intothedata.com/"
languageCode = "ko"
title = "인투더데이터 데이터과학 위키 Datascience Wiki"
theme = "hugo-book"
#theme = "ananke"

hasCJKLanguage = true
publishDir = "public"
pygmentsStyle = "monokai"

googleAnalytics = "G-L822Z5JJRH"

# lastmod를 활성화
enableGitInfo = true

[services]
  [services.googleAnalytics]
    id = "G-L822Z5JJRH"

[frontmatter]
date = ["date", "publishDate", "lastmod"]
lastmod = ["lastmod", ":git", "date", "publishDate"]
publishDate = ["publishDate", "date"]
expiryDate = ["expiryDate"]

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 1

[outputs]
    home = [ "HTML"]
    page = [ "HTML"]
    tags = [ "HTML"]

# taxonomy
[taxonomies]
  category = "categories"
  tag = "tags"

[params]
    subtitle = "데이터사이언스 위키"
    author = "IntoTheData"
    
    # Book theme specific settings
    BookTheme = "light"
    BookToC = true
    BookSection = "/"  # Using root for all sections
    BookSearch = true
    BookComments = false
    
    custom_css = ["css/intothedata.css"]

[[menu.shortcuts]]
pre = "<h3>More</h3>"
name = "<i class='fa fa-bookmark'></i> 색인"
identifier = "tag-list"
url = "/taglist"
weight = 1

[[menu.shortcuts]]
name = "<i class='fa fa-envelope'></i> Contact"
identifier = "contact"
url = "mailto: intothedata@gmail.com"
weight = 2
