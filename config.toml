# ------------------------------
# intothedata hugo configuration
# ------------------------------

baseURL = "http://intothedata.com/"
languageCode = "ko"
title = "인투더데이터 데이터과학 위키 Datascience Wiki"
# theme = "ananke"
# theme = "docdock"  # 기본 책 테마
# theme = "techdocs"  # 예전 테마
# theme = "book"  # 간단한 책 테마
theme = "hugo-theme-learn"  # 예쁜 학습 테마 2021-08-02 18:34

hasCJKLanguage = false
publishDir = "public"
pygmentsStyle = "monokai"

googleAnalytics = "UA-53664159-1"

[markup.goldmark.renderer]
unsafe= true

[outputs]
	# home = [ "HTML", "JSON"]
	# page = [ "HTML", "JSON"]
	home = [ "HTML"]
	page = [ "HTML"]

# taxonomy
[taxonomies]
  category = "categories"
  tag = "tags"

[params]
    subtitle = "데이터에서 인사이트 찾아내기"
    author = "IntoTheData"
    # ordersectionsby = "title"
    ordersectionsby = "weight"
    # showVisitedLinks = true

    # themeVariant = "intothedata"  # techdoc에서만 쓰는 것이고
    # Change default color scheme with a variant one. Can be "red", "blue", "green".
    themeVariant = ""  # 테마
    custom_css = ["css/intothedata.css"]

[[menu.shortcuts]]
pre = "<h3>More</h3>"
name = "<i class='fa fa-bookmark'></i> 색인"
identifier = "tag-list"
url = "/taglist"
weight = 1

[[menu.shortcuts]]
name = "<i class='fa fa-envelope'></i> Contact"
identifier = "contact"
url = "mailto: intothedata@gmail.com"
weight = 2
